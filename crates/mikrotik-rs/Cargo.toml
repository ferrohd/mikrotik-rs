[package]
name = "mikrotik-rs"
description = "Asynchronous Rust library for interfacing with MikroTik routers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
# A byte-for-byte copy of the repository README, so the crates.io page and the GitHub landing
# page say the same thing. `just publish` fails if the two drift. It is a copy rather than a
# symlink because release-plz cannot follow one out of the package directory — see that recipe.
readme = "README.md"
publish = true

[lib]
doctest = false

[features]
default = ["tokio", "std"]
std = ["mikrotik-proto/std"]
tokio = ["dep:mikrotik-tokio"]
embassy = ["dep:mikrotik-embassy"]
tokio-tls = ["mikrotik-tokio?/tokio-tls"]

[dependencies]
mikrotik-proto = { workspace = true }
mikrotik-tokio = { workspace = true, optional = true }
mikrotik-embassy = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
