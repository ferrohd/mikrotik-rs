[package]
name = "mikrotik-embassy"
description = "Embassy async embedded client for MikroTik RouterOS API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = true

[lib]
doctest = false

[dependencies]
mikrotik-proto = { workspace = true }
embedded-io = "0.7"
embedded-io-async = "0.7"
embassy-sync = "0.8"
embassy-futures = "0.1"

# Host-side testing only: the crate itself is unconditionally no_std, and `just targets` builds
# it for thumbv7em-none-eabihf to prove it. critical-section's `std` implementation is what lets
# embassy-sync's primitives run under a normal test harness.
[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
critical-section = { version = "1.1", features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
