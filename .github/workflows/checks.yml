name: Checks

# Single source of truth for the cargo check suite.
# Called by pr-checks.yml and by the release preflight, so the two can
# never drift apart.
on:
    workflow_call:

env:
    CARGO_TERM_COLOR: always

jobs:
    fmt:
        name: 📐 Format
        runs-on: ubuntu-latest
        steps:
            - name: 🛒 Checkout
              uses: actions/checkout@v6

            - name: 🦀 Toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt

            - name: 📐 Rustfmt
              run: cargo fmt --all -- --check

    clippy:
        name: 📎 Clippy
        runs-on: ubuntu-latest
        steps:
            - name: 🛒 Checkout
              uses: actions/checkout@v6

            - name: 🦀 Toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - name: 📎 Clippy
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    build:
        name: 🔨 Build
        runs-on: ubuntu-latest
        steps:
            - name: 🛒 Checkout
              uses: actions/checkout@v6

            - name: 🦀 Toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: 🔨 Build
              run: cargo build --workspace

    test:
        name: 🧪 Test
        runs-on: ubuntu-latest
        steps:
            - name: 🛒 Checkout
              uses: actions/checkout@v6

            - name: 🦀 Toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: 🧪 Test (all features)
              run: cargo test --workspace --all-features

    test-features:
        name: 🧪 Feature combinations
        runs-on: ubuntu-latest
        steps:
            - name: 🛒 Checkout
              uses: actions/checkout@v6

            - name: 🦀 Toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: 📦 Install cargo-hack
              uses: taiki-e/install-action@cargo-hack

            - name: 🔍 Check each feature independently
              run: cargo hack check --each-feature --no-dev-deps --workspace --ignore-private

            - name: 🔍 Check feature powerset (facade)
              run: cargo hack check --feature-powerset --depth 2 --no-dev-deps -p mikrotik-rs

            - name: 🧪 Test no_std path
              run: cargo test -p mikrotik-proto --no-default-features

    doc:
        name: 📖 Doc
        runs-on: ubuntu-latest
        env:
            RUSTDOCFLAGS: -D warnings
        steps:
            - name: 🛒 Checkout
              uses: actions/checkout@v6

            - name: 🦀 Toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: 📖 Doc
              run: cargo doc --workspace --no-deps
