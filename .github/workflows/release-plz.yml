name: Release-plz

on:
    push:
        branches:
            - master

env:
    CARGO_TERM_COLOR: always

jobs:
    # Same suite the pull request checks run. The release job gates on this:
    # release PRs are opened with the default GITHUB_TOKEN, which cannot trigger
    # workflow runs, so this is the only thing standing between a merged release
    # PR and crates.io.
    checks:
        name: Cargo
        uses: ./.github/workflows/checks.yml

    # Publish the packages whose version is not on the registry yet, then tag
    # and create the GitHub release. With `release_always = false` this only
    # acts on commits coming from a release PR.
    release-plz-release:
        name: Release-plz release
        runs-on: ubuntu-latest
        needs: checks
        if: ${{ github.repository_owner == 'ferrohd' }}
        permissions:
            contents: write
            pull-requests: read
        steps:
            - name: 🛒 Checkout
              uses: actions/checkout@v7
              with:
                  # Full history is required to release from the latest commit
                  # of the release PR.
                  fetch-depth: 0
                  persist-credentials: false

            - name: 🦀 Toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: 🚀 Release
              uses: release-plz/action@v0.5.135
              with:
                  command: release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

    # Open or update the release PR carrying the version bumps and changelogs.
    release-plz-pr:
        name: Release-plz PR
        runs-on: ubuntu-latest
        if: ${{ github.repository_owner == 'ferrohd' }}
        permissions:
            contents: write
            pull-requests: write
        # Serialise runs so two pushes cannot race on the same release PR.
        # Deliberately no `cancel-in-progress`, which would drop a pending run.
        concurrency:
            group: release-plz-${{ github.ref }}
            cancel-in-progress: false
        steps:
            - name: 🛒 Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: 🦀 Toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: 📝 Release PR
              uses: release-plz/action@v0.5.135
              with:
                  command: release-pr
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
