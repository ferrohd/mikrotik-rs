name: Release-plz

on:
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publishes whatever is not on the registry yet, then tags. With
  # `release_always = false` this only acts on a merged release PR.
  #
  # No `needs: checks`: the PAT means the release PR is checked like any other PR before
  # the merge that reaches this job, so gating here would just run the suite twice.
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'ferrohd' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so release-plz can see what changed since the last release.
          fetch-depth: 0
          # The token goes to the release-plz step alone, not into the git config.
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      # So what reaches crates.io is built with the compiler CI checked with.
      - name: Put the pinned toolchain on PATH
        run: nix develop .#ci --command bash -c 'command -v cargo | xargs dirname' >> "$GITHUB_PATH"

      - name: Release
        uses: release-plz/action@v0.5
        with:
          command: release
          # Pinned to the flake's release-plz so this and `just release-check` run the same
          # binary. After a flake.lock bump, read `release-plz --version` in the dev shell.
          version: "0.3.158"
        env:
          # A PAT, not GITHUB_TOKEN: a tag pushed by the default token does not trigger
          # workflows, and the release PR it opens gets no CI at all.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  # Open or update the release pull request carrying the version bumps and changelogs.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'ferrohd' }}
    permissions:
      contents: write
      pull-requests: write
    # Serialise so two pushes cannot race on the same PR. No cancel-in-progress: it would drop a
    # pending run rather than queue it.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      # The action supplies its own cargo-semver-checks, which can disagree with the flake's
      # about a rustdoc format. That is what an "unsupported rustdoc format" failure means.
      - name: Put the pinned toolchain on PATH
        run: nix develop .#ci --command bash -c 'command -v cargo | xargs dirname' >> "$GITHUB_PATH"

      - name: Release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          # Keep in step with the `version` in the release job above, and with the flake.
          version: "0.3.158"
        env:
          # The PAT is what lets ci.yml run on the release pull request it opens.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
