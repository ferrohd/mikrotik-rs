name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Supersede on a pull request, never on master: master runs populate the cache pull requests
# restore from, and cancelling one leaves the branch status ambiguous.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job is the same four steps against a different justfile recipe, which is also what you
# run locally: `nix develop .#ci --command just <recipe>`. Every tool comes from flake.lock, so
# no `with: toolchain:` or install-action can drift from local.
#
# All Linux. Platforms we support but cannot test are reached by `cargo check --target` in the
# `targets` job.

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fmt, recipe: fmt }
          - { name: clippy, recipe: clippy }
          - { name: doc, recipe: doc }
          - { name: "test (all features)", recipe: test, args: --all-features }
          - { name: "test (default features)", recipe: test }
          # Not `test --no-default-features`: the examples are workspace members that depend on
          # the facade with default features, and cargo unifies features across a --workspace
          # selection, so that form silently re-enables what it is meant to switch off.
          - { name: "test (no default features)", recipe: test-minimal }
          - { name: feature combinations, recipe: features }
          # Cross-checks for the platforms we support but never run.
          - { name: other targets, recipe: targets }
          - { name: extended property tests, recipe: proptest }
          - { name: publish preflight, recipe: publish }
          - { name: supply chain, recipe: deny }
          - { name: unused dependencies, recipe: unused }
          # Four crates are already on the registry, so the baseline exists. Worth the job in
          # particular because the facade re-exports the adapters wholesale: a change to a type
          # in mikrotik-proto is a mikrotik-rs break without touching mikrotik-rs.
          - { name: semver, recipe: semver }
          - { name: toml formatting, recipe: toml }
          - { name: spelling, recipe: typos }
          - { name: workflow lint, recipe: workflows }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      # rust-cache shells out to rustc for its cache key, and the toolchain only exists inside
      # the dev shell.
      - name: Put the pinned toolchain on PATH
        run: nix develop .#ci --command bash -c 'command -v cargo | xargs dirname' >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per job, and only master writes, so pull requests cannot evict each other.
          shared-key: ${{ matrix.recipe }}${{ matrix.args }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - run: nix develop .#ci --command just ${{ matrix.recipe }} ${{ matrix.args }}

  # Separate because it is the one job not on the pinned stable: the shell provides a compiler
  # matching Cargo.toml's rust-version. No rustup shim, so there is no RUSTUP_TOOLCHAIN override
  # for rust-toolchain.toml's channel to silently win against.
  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Put the MSRV toolchain on PATH
        run: nix develop .#msrv --command bash -c 'command -v cargo | xargs dirname' >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: nix develop .#msrv --command just msrv

  pr-title:
    name: pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Squash merge makes the PR title the commit message, and release-plz derives the changelog
      # from these prefixes. Keep this list and release-plz.toml's commit_parsers in step: a type
      # accepted here but unparsed there files those commits under "Other", silently.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
            style
            revert
          requireScope: false
