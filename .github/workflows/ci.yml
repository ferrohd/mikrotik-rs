name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never on master: those runs populate the cache pull requests restore from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job is the same four steps against a different justfile recipe, which is what you
# run locally. Every tool comes from flake.lock, so nothing here can drift from it.

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fmt, recipe: fmt }
          - { name: clippy, recipe: clippy }
          - { name: doc, recipe: doc }
          - { name: "test (all features)", recipe: test, args: --all-features }
          - { name: "test (default features)", recipe: test }
          # Not `test --no-default-features`: see the recipe.
          - { name: "test (no default features)", recipe: test-minimal }
          - { name: feature combinations, recipe: features }
          - { name: other targets, recipe: targets }
          - { name: extended property tests, recipe: proptest }
          - { name: publish preflight, recipe: publish }
          - { name: supply chain, recipe: deny }
          - { name: unused dependencies, recipe: unused }
          - { name: semver, recipe: semver }
          - { name: toml formatting, recipe: toml }
          - { name: spelling, recipe: typos }
          - { name: workflow lint, recipe: workflows }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      # rust-cache shells out to rustc for its key, and the toolchain is only in the shell.
      - name: Put the pinned toolchain on PATH
        run: nix develop .#ci --command bash -c 'command -v cargo | xargs dirname' >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per job, and only master writes, so pull requests cannot evict each other.
          shared-key: ${{ matrix.recipe }}${{ matrix.args }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - run: nix develop .#ci --command just ${{ matrix.recipe }} ${{ matrix.args }}

  # The one job not on the pinned stable: this shell has a compiler matching rust-version.
  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Put the MSRV toolchain on PATH
        run: nix develop .#msrv --command bash -c 'command -v cargo | xargs dirname' >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: nix develop .#msrv --command just msrv

  pr-title:
    name: pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Keep in step with release-plz.toml's commit_parsers: a type accepted here but
      # unparsed there files those commits under "Other", silently.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
            style
            revert
          requireScope: false
