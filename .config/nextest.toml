# nextest, not `cargo test`, for the per-test timeout: a test blocked on a dead
# socket would otherwise hang the run until the job times out.

# On `default` so a bare run is protected too; custom profiles inherit it.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
# One run should report every failure, not just the first.
fail-fast = false
