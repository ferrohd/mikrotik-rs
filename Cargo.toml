[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
# One version for all four crates; release-plz bumps this single value.
version = "0.10.0"
edition = "2024"
# Declared once: flake.nix reads it to build devShells.msrv, so this *is* the
# compiler `just msrv` runs. Keep clippy.toml in step. Measured, not chosen —
# let-chains and heapless 0.9 both need it.
rust-version = "1.88"
authors = ["Alessandro Ferrara"]
keywords = ["mikrotik", "router", "api", "async", "tokio"]
license = "AGPL-3.0-only"
categories = ["api-bindings", "asynchronous", "network-programming"]
repository = "https://github.com/ferrohd/mikrotik-rs"
homepage = "https://github.com/ferrohd/mikrotik-rs"
documentation = "https://docs.rs/mikrotik-rs"

[workspace.dependencies]
# Core dependencies
tokio = "1.48.0"
thiserror = { version = "2.0", default-features = false }
hashbrown = "0.17"

# Path *and* version: `cargo publish` keeps only the version.
mikrotik-proto = { version = "0.10.0", path = "crates/mikrotik-proto" }
mikrotik-tokio = { version = "0.10.0", path = "crates/mikrotik-tokio" }
mikrotik-embassy = { version = "0.10.0", path = "crates/mikrotik-embassy" }
mikrotik-rs = { version = "0.10.0", path = "crates/mikrotik-rs" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
# priority = -1 is what allows individual overrides alongside a group.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
