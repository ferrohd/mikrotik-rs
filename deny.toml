# Supply-chain policy, checked by `cargo deny check`.

[graph]
# No `targets`: with none set every target is walked, which is what surfaces the
# Windows- and macOS-only crates tokio pulls in. `all-features` because
# tokio-tls is not a default, so rustls would otherwise go unchecked.
all-features = true

[advisories]
# A yanked dependency cannot be reproduced.
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
# Enumerated, not guessed. Omitting one side of an `OR` records which side we
# take. This matters more than usual here: the CLA reserves the right to
# relicense commercially, and a dependency that cannot be sublicensed would
# quietly poison that.
allow = [
  "AGPL-3.0-only",                  # this workspace
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
# Two versions means two sets of types that do not interconvert. On a failure,
# bump the parent or record it in `skip` with a reason.
multiple-versions = "deny"
skip = []

# allow-wildcard-paths exempts a cyclic dev-dependency, which must be declared
# by path alone or neither crate can be published first. None today.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
