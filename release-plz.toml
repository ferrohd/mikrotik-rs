[workspace]
# Publish when the release PR merges, not on every commit to master.
release_always = false

# Pinned: the default switches to "v{{ version }}" when only one package is
# publishable. The pre-release-plz tags were `v0.9.0`-style; one baseline tag
# per crate was backfilled at the commit v0.9.0 points at.
git_tag_name = "{{ package }}-v{{ version }}"

# `cargo publish` verifies with default features only, leaving tokio-tls and
# the embassy adapter unverified at the moment they ship.
publish_all_features = true

pr_labels = ["release"]

[changelog]
protect_breaking_commits = true

# First match wins. Keep in step with ci.yml's `types:` — a type accepted there
# but unhandled here lands silently under "Other".
commit_parsers = [
  { message = '^feat', group = "Added" },
  { message = '^fix', group = "Fixed" },
  { message = '^perf', group = "Performance" },
  { message = '^refactor', group = "Changed" },
  { message = '^revert', group = "Changed" },
  { message = '^docs', group = "Documentation" },
  # Matched before the skip rule below; renovate.json5 forces this prefix.
  { message = '^(chore|build)\(deps\)', group = "Dependencies" },
  { message = '^(ci|style|test|chore|build)', skip = true },
  { message = '^.*', group = "Other" },
]

# The four crates share one inherited version. Without `version_group`,
# release-plz computes a next version per package and has four answers for one
# field.

[[package]]
name = "mikrotik-proto"
version_group = "mikrotik"

[[package]]
name = "mikrotik-tokio"
version_group = "mikrotik"

[[package]]
name = "mikrotik-embassy"
version_group = "mikrotik"

[[package]]
name = "mikrotik-rs"
version_group = "mikrotik"

# The examples are members only so --all-targets compiles them. Both keys are
# needed: `release = false` does the work, but release-plz validates the config
# against every manifest first and rejects a `publish = false` crate whose
# config leaves `publish` at its default.

[[package]]
name = "check-update"
publish = false
release = false

[[package]]
name = "macro-example"
publish = false
release = false

[[package]]
name = "network-monitor"
publish = false
release = false

[[package]]
name = "system-resource"
publish = false
release = false

[[package]]
name = "users"
publish = false
release = false
