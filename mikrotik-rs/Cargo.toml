[package]
name = "oxidns-mikrotik-rs"
version = "0.8.1"
description = "OxiDNS-maintained MikroTik RouterOS client with lossless Tokio response delivery"
edition.workspace = true
authors.workspace = true
keywords.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
readme = "../README.md"
publish = ["crates-io"]

[lib]
name = "mikrotik_rs"
doctest = false

[lints]
workspace = true

[features]
default = ["tokio", "std"]
std = ["mikrotik-proto/std"]
tokio = ["dep:mikrotik-tokio"]
embassy = ["dep:mikrotik-embassy"]
tokio-tls = ["mikrotik-tokio?/tokio-tls"]

[dependencies]
mikrotik-proto = { workspace = true }
mikrotik-tokio = { workspace = true, optional = true }
mikrotik-embassy = { workspace = true, optional = true }
