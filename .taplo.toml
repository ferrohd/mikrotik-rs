# An explicit `include`: taplo 0.10's `exclude` does not stop it walking into
# .direnv and formatting the whole of nixpkgs.
include = ["Cargo.toml", "crates/*/Cargo.toml", "examples/*/Cargo.toml", "*.toml", ".config/*.toml"]

[formatting]
# Match rustfmt.toml; taplo's default of 80 explodes every feature list.
column_width = 100
