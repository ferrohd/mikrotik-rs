# TOML formatting, checked by `just toml`.
#
# An explicit `include` rather than `**/*.toml` plus `exclude`, because taplo 0.10's `exclude`
# does nothing: it still walks into .direnv/flake-inputs and finds the whole of nixpkgs.
include = ["Cargo.toml", "crates/*/Cargo.toml", "examples/*/Cargo.toml", "*.toml", ".config/*.toml"]

[formatting]
# Match rustfmt.toml. taplo's default of 80 explodes every `features = [...]` onto its own lines.
column_width = 100
